name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: yomu-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publier dans « Releases » (lien direct pour le téléphone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Yomu.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Yomu.apk \
            --title "Yomu (dernière version)" \
            --notes "Compilé automatiquement depuis le commit ${GITHUB_SHA::7}.

          versionCode: ${GITHUB_RUN_NUMBER}
          versionName: 2.0.${GITHUB_RUN_NUMBER}"
